name: Publish to npm

# Publishing runs here rather than from a laptop so the registry token lives in
# GitHub Secrets and is never pasted into a terminal, a chat window or a shell
# history. Trigger it from the Actions tab, or let it fire when you publish a
# GitHub Release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack, but do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The suite takes about 20s. A hung child process in a spawn-based test
    # would otherwise sit on the runner until the six hour default, and the
    # run reads as "cancelled" with nothing saying why.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Printed before the suite so a runner that dies mid-test still leaves
      # enough behind to tell why. Two dispatched runs reported this step as
      # "cancelled" a second or two in, which is neither a failing assertion
      # nor a timeout, and the logs are not readable without admin.
      - name: Environment
        run: |
          node --version && npm --version
          echo "cores: $(nproc)"
          free -m || true
          df -h / | tail -1

      - name: Run the test suite
        # --test-concurrency=2 rather than the default one process per core.
        # Several of these files spawn a full gateway or an MCP server of their
        # own, so the default fans out to a few dozen node processes at once,
        # each loading express, 46 provider entries and SQLite. That is the one
        # difference between this runner and a developer machine that fits the
        # symptom: killed early, no assertion, no timeout.
        run: node --test --test-concurrency=2 "test/*.test.mjs"
        timeout-minutes: 5

      # Proves the tarball carries no credentials or local state before anything
      # reaches the registry. A published secret cannot be recalled.
      - name: Check the tarball for secrets and local state
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].files.map(f => f.path);
            const banned = files.filter(p =>
              /^\.env$/.test(p) || p.startsWith("data/") || p.startsWith("test/") ||
              /\.(tgz|log)$/.test(p) || /settings\.json|usage\.jsonl|\.salt|memory\.db/.test(p));
            if (banned.length) { console.error("Refusing to publish. Found:\n  " + banned.join("\n  ")); process.exit(1); }
            console.log("Tarball clean: " + files.length + " files, no credentials or local state.");
          '

      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry run. Nothing was published."
          echo "Re-run from the Actions tab with 'Validate and pack' unchecked to publish."
