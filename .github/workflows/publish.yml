name: Publish to npm

# Publishing runs here rather than from a laptop so the registry token lives in
# GitHub Secrets and is never pasted into a terminal, a chat window or a shell
# history. Trigger it from the Actions tab, or let it fire when you publish a
# GitHub Release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack, but do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release gate is the deterministic half of the suite (npm run
      # test:unit): the pure files that validate routing, security, guardrail,
      # cache, quota and crypto logic, finishing in about 15s on a runner. The
      # process-spawning integration files (test:integration) are deliberately
      # NOT run here. They repeatedly took the runner down with a shutdown
      # signal that no timeout or concurrency change fixed, and blocking a
      # release on a job that dies from platform reclaim rather than a real
      # defect is worse than not running it. They still run in ci.yml on every
      # push for visibility; they just do not hold up a publish. The file lists
      # for both live in package.json, so there is one source of truth.
      - name: Run the deterministic test files
        run: npm run test:unit
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Proves the tarball carries no credentials or local state before anything
      # reaches the registry. A published secret cannot be recalled.
      - name: Check the tarball for secrets and local state
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].files.map(f => f.path);
            const banned = files.filter(p =>
              /^\.env$/.test(p) || p.startsWith("data/") || p.startsWith("test/") ||
              /\.(tgz|log)$/.test(p) || /settings\.json|usage\.jsonl|\.salt|memory\.db/.test(p));
            if (banned.length) { console.error("Refusing to publish. Found:\n  " + banned.join("\n  ")); process.exit(1); }
            console.log("Tarball clean: " + files.length + " files, no credentials or local state.");
          '

      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry run. Nothing was published."
          echo "Re-run from the Actions tab with 'Validate and pack' unchecked to publish."
