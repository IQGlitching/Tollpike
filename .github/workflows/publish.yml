name: Publish to npm

# Publishing runs here rather than from a laptop so no registry credential is
# ever pasted into a terminal, a chat window or a shell history. Trigger it
# from the Actions tab, or let it fire when you publish a GitHub Release.
#
# Authentication is npm trusted publishing: npm checks this workflow's OIDC
# identity (repo IQGlitching/Tollpike, file publish.yml, environment npm) and
# issues a one-use credential for this run, so there is no long-lived token to
# steal. NODE_AUTH_TOKEN below is only the fallback while the trusted publisher
# is being set up on npmjs.com; once a release has gone out through OIDC,
# delete the NPM_TOKEN secret and that line.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack, but do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com names this environment, so a workflow
    # that does not run in it cannot publish. Adding a required reviewer to it
    # (Settings > Environments > npm) makes every publish wait for your click.
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11.19.1 --ignore-scripts

      # A release tagged v0.12.0 must publish 0.12.0. Publishing whatever
      # package.json happens to say under another tag is how a registry ends
      # up with a version no tag points at.
      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'release' }}
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $have"; exit 1; fi

      # No dependency has an install script today. --ignore-scripts keeps it
      # that way: a compromised dependency release cannot run code in the one
      # job that holds publish rights.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The release gate is the deterministic half of the suite (npm run
      # test:unit): the pure files that validate routing, security, guardrail,
      # cache, quota and crypto logic, finishing in about 15s on a runner. The
      # process-spawning integration files (test:integration) are deliberately
      # NOT run here. They repeatedly took the runner down with a shutdown
      # signal that no timeout or concurrency change fixed, and blocking a
      # release on a job that dies from platform reclaim rather than a real
      # defect is worse than not running it. They still run in ci.yml on every
      # push for visibility; they just do not hold up a publish. The file lists
      # for both live in package.json, so there is one source of truth.
      - name: Run the deterministic test files
        run: npm run test:unit
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Proves the tarball carries no credentials or local state before anything
      # reaches the registry. A published secret cannot be recalled.
      - name: Check the tarball for secrets and local state
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].files.map(f => f.path);
            const banned = files.filter(p =>
              /^\.env$/.test(p) || p.startsWith("data/") || p.startsWith("test/") ||
              /\.(tgz|log)$/.test(p) || /settings\.json|usage\.jsonl|\.salt|memory\.db/.test(p));
            if (banned.length) { console.error("Refusing to publish. Found:\n  " + banned.join("\n  ")); process.exit(1); }
            console.log("Tarball clean: " + files.length + " files, no credentials or local state.");
          '

      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          # Fallback only; npm tries OIDC first. Remove with the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry run. Nothing was published."
          echo "Re-run from the Actions tab with 'Validate and pack' unchecked to publish."
