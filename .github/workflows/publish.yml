name: Publish to npm

# Publishing runs here rather than from a laptop so the registry token lives in
# GitHub Secrets and is never pasted into a terminal, a chat window or a shell
# history. Trigger it from the Actions tab, or let it fire when you publish a
# GitHub Release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack, but do not publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Nothing here is slow now that the suite lives in ci.yml. A bound means a
    # stuck step fails as a timeout rather than sitting on the runner.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to read ci.yml's conclusion for this commit
      id-token: write # required for npm provenance attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite runs in ci.yml, not here. Four attempts to run it in this
      # job died a second or two in with "the runner has received a shutdown
      # signal", which is the platform reclaiming the VM, and neither timeouts
      # nor a concurrency cap made any difference. Rather than re-run the
      # thing that keeps taking the runner down, this gates on the result CI
      # already recorded for this exact commit. Same guarantee, and a red
      # suite still blocks the release.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow=ci.yml --commit="$GITHUB_SHA" \
            --json conclusion --jq '.[0].conclusion // "missing"')
          echo "CI for $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "Refusing to publish: CI for this commit is '$conclusion', not 'success'."
            echo "Run the CI workflow on this commit and let it pass first."
            exit 1
          fi

      # Proves the tarball carries no credentials or local state before anything
      # reaches the registry. A published secret cannot be recalled.
      - name: Check the tarball for secrets and local state
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].files.map(f => f.path);
            const banned = files.filter(p =>
              /^\.env$/.test(p) || p.startsWith("data/") || p.startsWith("test/") ||
              /\.(tgz|log)$/.test(p) || /settings\.json|usage\.jsonl|\.salt|memory\.db/.test(p));
            if (banned.length) { console.error("Refusing to publish. Found:\n  " + banned.join("\n  ")); process.exit(1); }
            console.log("Tarball clean: " + files.length + " files, no credentials or local state.");
          '

      - name: Publish
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry run. Nothing was published."
          echo "Re-run from the Actions tab with 'Validate and pack' unchecked to publish."
