name: CI

# Two test jobs, not one.
#
# The whole suite in a single job kept taking the runner down: it would die a
# second or two in with "the runner has received a shutdown signal", the
# platform reclaiming the VM rather than any assertion or timeout. Serialising
# with --test-concurrency=1 moved the death from ~2s to ~35s but did not stop
# it, so the cause is cumulative load across the run, not one bad test.
#
# So the files are split by what they cost. Seven of them spawn real child
# processes or bind real sockets (a full gateway, an MCP server, mock upstream
# servers, the embedded-service supervisor); the other seventeen are pure and
# include the multi-megabyte compression-DoS inputs. Each group is a fraction
# of the peak, and the two run on separate VMs. A red result in either fails
# the workflow, which is what publish.yml gates on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-unit:
    name: Unit and integration (no spawned processes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Environment
        run: |
          node --version
          npm --version
          echo "cores: $(nproc)"
          free -m
      # Same list publish.yml gates on. Both call the package.json script, so
      # the file list has one source of truth.
      - name: Run the pure test files
        run: npm run test:unit
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test-process:
    name: Process-spawning tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Environment
        run: |
          node --version
          npm --version
          echo "cores: $(nproc)"
          free -m
      # One step per file, deliberately. The previous single step ran all
      # seven together and died with "cancelled", the platform killing the VM,
      # with no way to tell which file did it. As separate steps, a runner
      # death marks the finished files "success" and the culprit "cancelled",
      # so the next run names the offender for free.
      #
      # No NODE_OPTIONS heap bump here. That flag belongs on the pure job,
      # whose compression-DoS inputs need it; on this job it is actively
      # harmful, since each spawned `node src/server.js` inherits it and a
      # 4GB ceiling times a runner plus a child gateway is an OOM on a ~7GB
      # runner, which is exactly what a "cancelled" with no assertion is.
      - name: env-loading
        run: node --test test/env-loading.test.mjs
      - name: adapters.integration
        run: node --test test/adapters.integration.test.mjs
      - name: resilience-http
        run: node --test test/resilience-http.test.mjs
      - name: protocols
        run: node --test test/protocols.test.mjs
      - name: hardening
        run: node --test test/hardening.test.mjs
      - name: subsystems
        run: node --test test/subsystems.test.mjs
      - name: gateway.e2e
        run: node --test test/gateway.e2e.test.mjs
