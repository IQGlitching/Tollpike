name: CI

# Three jobs: one for the deterministic suite, one that discovers the
# integration file list, and a matrix that runs each integration file on its
# own fresh VM.
#
# History: the seven process-spawning files repeatedly took a single runner
# down at 27-40s with "the runner has received a shutdown signal" (platform
# reclaim, not an assertion or a timeout). Timeouts, --test-concurrency=1,
# dropping the heap flag and one-step-per-file all failed to stop it. Running
# each file on its own VM is both the diagnosis and the likely fix: if the
# death was cumulative load, every leg now survives; if one file kills its own
# VM, the matrix names it exactly instead of hiding it behind a blob.
#
# fail-fast: false so one leg dying does not cancel the rest — the point is to
# see all seven outcomes at once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-unit:
    name: Unit (deterministic, gates releases)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same script publish.yml gates on, so the release path is exercised here
      # on every push. The file list lives in package.json.
      - name: Run the deterministic test files
        run: npm run test:unit
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  discover-integration:
    name: Discover integration files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      # The matrix reads its file list from package.json's test:integration
      # script, so there is no second copy of the list to drift. The
      # security-invariants suite already asserts every test file is in
      # test:unit or test:integration.
      - id: list
        run: node -e 'process.stdout.write("files=" + JSON.stringify(require("./package.json").scripts["test:integration"].match(/test\/[A-Za-z0-9.-]+\.test\.mjs/g)))' >> "$GITHUB_OUTPUT"

  test-integration:
    name: "integration: ${{ matrix.file }}"
    needs: discover-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-integration.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Environment
        run: |
          node --version
          echo "cores: $(nproc)"
          free -m
      - name: Run one integration file
        run: node --test "${{ matrix.file }}"
