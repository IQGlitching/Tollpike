name: Deploy landing page

# Publishes the website to GitHub Pages, which is free and served from a CDN.
# scripts/build-site.mjs assembles site/ (home, gateway, audit, docs
# and guides) from public/landing.html and its own page content, using only
# Node built-ins, so there is nothing to install.

on:
  push:
    branches: [main]
    paths:
      - "public/landing.html"
      - "public/landing.js"
      - "public/favicon.svg"
      - "scripts/build-site.mjs"
      - "deploy/vercel/404.html"
      - ".github/workflows/pages.yml"
      # The site prints the version from package.json.
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the site
        run: |
          node scripts/build-site.mjs
          rm -rf _site && cp -r site _site
          # Pages runs Jekyll unless told not to, and Jekyll ignores files it
          # does not recognise. This is a plain static site.
          touch _site/.nojekyll

      - name: Check nothing but the site shipped
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const files = [];
            (function walk(d) { for (const f of fs.readdirSync(d)) { const p = path.join(d, f); fs.statSync(p).isDirectory() ? walk(p) : files.push(path.relative("_site", p).split(path.sep).join("/")); } })("_site");
            const bad = files.filter((f) => f !== ".nojekyll" && !/\.(html|css|js|svg)$/.test(f));
            if (bad.length) { console.error("Unexpected files in _site: " + bad.join(", ")); process.exit(1); }
            for (const need of ["index.html", "routing.html", "audit.html", "docs.html", "guides/index.html", "site.css", "landing.js"]) {
              if (!files.includes(need)) { console.error("Missing " + need); process.exit(1); }
            }
            if (!fs.readFileSync("_site/index.html", "utf8").includes("landing.js")) { console.error("index.html lost its script reference"); process.exit(1); }
            console.log("Site OK: " + files.length + " files.");
          '

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
